[project]
name = "kkbox-discord-rpc-macos"
version = "1.0.0"
description = "KKBOX Discord Rich Presence for macOS, using the system Now Playing info instead of DOM scraping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypresence @ https://github.com/qwertyquerty/pypresence.git",
    "psutil",
    "rumps",
]

[dependency-groups]
build = [
    "py2app",
]
